# XcodeGen spec. Generate with: cd apple && xcodegen generate
# Signing: export DAILIES_TEAM=<your team id> before generating (never commit a team id).
# Push notifications: also export DAILIES_PUSH=-Push (needs a paid developer team).
# With no team, simulator builds are signed to run locally.
name: Dailies
options:
  bundleIdPrefix: lol.thedailies
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # the Mac app downloaded from the website updates itself (DailiesDirect only, never the App Store build)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "${DAILIES_TEAM}"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "5" # bump for every upload to App Store Connect
    # HTTPS only, no custom encryption: skips the export-compliance question on each upload
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Dailies:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Dailies
      - Shared
    dependencies:
      - target: DailiesShare
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.thedailies.app
        PRODUCT_NAME: Dailies
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Dailies
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # export DAILIES_PUSH=-Push before generating to sign with push notifications, which
        # need a paid Apple Developer Program team (a personal team can't sign them)
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Dailies/Dailies-iOS${DAILIES_PUSH}.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Dailies/Dailies-macOS${DAILIES_PUSH}.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
      configs:
        # Debug-only ATS exception for the local dev server (NSAllowsLocalNetworking)
        Debug:
          INFOPLIST_FILE: Config/Dailies-Debug-Info.plist

  # The Mac app for the website download: the same app as Dailies plus Sparkle, which updates it
  # in the background (DIRECT_DOWNLOAD in Swift). Dailies stays the App Store and iPhone build,
  # since the Mac App Store doesn't allow an app to update itself. apple/tools/release-mac.sh
  # archives this one.
  DailiesDirect:
    type: application
    platform: macOS
    sources:
      - Dailies
      - Shared
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.thedailies.app
        PRODUCT_NAME: Dailies
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/DailiesDirect-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: The Dailies
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Dailies/Dailies-macOS-Direct${DAILIES_PUSH}.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIRECT_DOWNLOAD
      configs:
        Debug:
          INFOPLIST_FILE: Config/DailiesDirect-Debug-Info.plist
          # its own folder: both targets make Dailies.app, and the App Store one must never pick
          # up this one's Sparkle.framework. Debug only: archives keep each scheme apart already,
          # and a moved Release folder makes Xcode process Sparkle twice (its signature then
          # clashes in the archive)
          CONFIGURATION_BUILD_DIR: $(BUILD_DIR)/$(CONFIGURATION)-direct$(EFFECTIVE_PLATFORM_NAME)

  DailiesShare:
    type: app-extension
    platform: iOS
    sources:
      - DailiesShare
      - path: Shared
        excludes: [SubmissionQueue.swift] # the extension submits directly, no queue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.thedailies.app.share
        PRODUCT_NAME: DailiesShare
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/DailiesShare-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: The Dailies
        CODE_SIGN_ENTITLEMENTS: DailiesShare/DailiesShare.entitlements
        SKIP_INSTALL: YES
      configs:
        Debug:
          INFOPLIST_FILE: Config/DailiesShare-Debug-Info.plist

  # UI tests that drive gestures the Simulator can't take by hand (swipes, drags).
  # Run: xcodebuild test -project apple/Dailies.xcodeproj -scheme DailiesUITests -destination '<simulator>'
  DailiesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DailiesUITests]
    dependencies:
      - target: Dailies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.thedailies.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dailies

schemes:
  DailiesDirect:
    build:
      targets:
        DailiesDirect: all
    run:
      config: Debug
    archive:
      config: Release
  DailiesUITests:
    build:
      targets:
        DailiesUITests: [test]
    test:
      targets: [DailiesUITests]

