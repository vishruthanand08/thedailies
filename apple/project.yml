# XcodeGen spec. Generate with: cd apple && xcodegen generate
# Signing: export DAILIES_TEAM=<your team id> before generating (never commit a team id).
# With no team, simulator builds are signed to run locally.
name: Dailies
options:
  bundleIdPrefix: lol.thedailies
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "${DAILIES_TEAM}"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Dailies:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Dailies
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.thedailies.app
        PRODUCT_NAME: Dailies
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Dailies
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Dailies/Dailies-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Dailies/Dailies-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
      configs:
        # Debug-only ATS exception for the local dev server (NSAllowsLocalNetworking)
        Debug:
          INFOPLIST_FILE: Config/Dailies-Debug-Info.plist
