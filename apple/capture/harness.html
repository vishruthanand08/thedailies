<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture harness</title>
<style>
  body { font: 15px -apple-system, system-ui, sans-serif; margin: 16px; background: #e9e4f7; color: #16162e; }
  button { font: inherit; font-weight: 700; display: block; width: 100%; margin: 8px 0; padding: 12px;
    border: 2.5px solid #16162e; border-radius: 12px; background: #fff; }
  #log { white-space: pre-wrap; font: 13px ui-monospace, monospace; background: #fff; border: 2px solid #16162e;
    border-radius: 12px; padding: 10px; min-height: 120px; }
  textarea { position: absolute; left: -9999px; }
</style>
<script>
  // In a normal browser there's no native handler: stub it so captures log to the page.
  // In the app's game browser the real handler exists and native shows a banner instead.
  var native = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dailiesCapture)
  if (!native) {
    window.webkit = { messageHandlers: { dailiesCapture: { postMessage: function (m) {
      document.getElementById('log').textContent += m.via + ': ' + m.text + '\n'
    } } } }
  }
  window.__HOSTS__ = [location.host]
</script>
<script src="capture.js"></script>
</head>
<body>
<h3>capture.js harness</h3>
<p id="mode"></p>
<button id="share">navigator.share</button>
<button id="writeText">clipboard.writeText</button>
<button id="write">clipboard.write (ClipboardItem)</button>
<button id="exec">execCommand('copy') from a hidden textarea</button>
<button id="dupe">share + writeText back to back (expect one capture)</button>
<textarea id="hidden"></textarea>
<div id="log"></div>
<script>
  document.getElementById('mode').textContent = native ? 'Native handler present: captures show as app banners.' : 'Stub handler: captures log below.'
  var n = 0
  function sample(via) { n += 1; return 'Harness ' + via + ' #' + n }
  document.getElementById('share').onclick = function () { navigator.share({ text: sample('share') }) }
  document.getElementById('writeText').onclick = function () { navigator.clipboard.writeText(sample('writeText')).catch(function () {}) }
  document.getElementById('write').onclick = function () {
    var blob = new Blob([sample('write')], { type: 'text/plain' })
    navigator.clipboard.write([new ClipboardItem({ 'text/plain': blob })]).catch(function () {})
  }
  document.getElementById('exec').onclick = function () {
    var ta = document.getElementById('hidden')
    ta.value = sample('execCommand')
    ta.focus()
    ta.select()
    document.execCommand('copy')
  }
  document.getElementById('dupe').onclick = function () {
    var t = sample('dupe')
    navigator.share({ text: t })
    navigator.clipboard.writeText(t).catch(function () {})
  }
</script>
</body>
</html>
